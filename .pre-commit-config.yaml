default_language_version:
  node: 25.2.1
  python: python3.13
# NVCARPS-CI generates BENCHMARK.md / skill-card.md and then signs the skill folder, so those files
# are part of the signed content. The generated license file and the verbatim legal texts are
# excluded for the same reason: reformatting them would rewrite content we do not author, and
# addlicense must not stamp an NVIDIA SPDX header onto third-party license texts. The DCO text in
# CONTRIBUTING.md is verbatim too but shares a file with prose, so an inline rumdl-disable guard
# scoped to the rules it trips protects that section instead of an exclude.
exclude: (?x)(
    ^tests/data/|
    ^skills/[^/]+/(BENCHMARK\.md|skill-card\.md|skill\.oms\.sig)$|
    ^LICENSE-3rd-party\.txt$|
    ^LICENSE$|
    ^NOTICE$
  )
repos:
  # Secret detection runs first: a credential that reaches a commit has to be rotated, not just
  # removed, so catching it before the commit exists is worth more than catching it in CI.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/jsh9/markdown-toc-creator
    rev: 0.1.3
    hooks:
      - id: markdown-toc-creator
        args: ["--config=ci/.markdown-toc-creator.toml"]
  - repo: https://github.com/google/addlicense
    rev: v1.2.0
    hooks:
      - id: addlicense
        args: ["-f", "ci/license-header.txt"]
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.60
    hooks:
      - id: rumdl-fmt
  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.15.0
    hooks:
      - alias: link-check
        name: link check
        id: markdown-link-check
        args: [--config, "ci/.link-check.json", --quiet]
        stages: [manual]
        exclude: (?x)(
            \bATTRIBUTIONS\b|
            /_src/
          )
