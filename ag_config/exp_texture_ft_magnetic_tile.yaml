#
# ``anomalygen_texture_ft`` — I2I anomaly-inpainting training recipe (magnetic_tile dataset).
#
# Built from ``exp_texture_ft_phone_screen.yaml`` — see that file for what each key does and which
# defaults are deliberately overridden. Only the dataset block differs.
#
# ``prepare_magnetic_tile_defect`` produces this dataset: one texture (``metal_surface``) with five
# defect types, each needing a matching ``{dataset_path}/metal_surface/anomaly_image/{defect}/``.
#
# All five are ``spatial_dependency: free`` — mask placement uses the whole image and needs no ROI
# prompt or CAD mask, so this is the cheapest of the three subjects to run end to end.

task_type: texture_ft
experiment: anomalygen_texture_ft
job_name: anomalygen_texture_ft

# --- dataset (required) -----------------------------------------------------------------------
dataset_name: magnetic_tile
anomaly_types: [[metal_surface, MT_Blowhole], [metal_surface, MT_Break], [metal_surface, MT_Crack], [metal_surface, MT_Fray], [metal_surface, MT_Uneven]]
dataset_path: datasets/magnetic_tile
testcase_jsonl: datasets/validation_magnetic_tile/testcase.jsonl

# --- model size (Cosmos3 backbone selection) --------------------------------------------------
model_size: nano   # nano (Qwen3-VL-8B, recommended default) | edge (Nemotron-3 Dense VL 2B, experimental)

# --- per-defect-type LoRA (adjust the rank and alpha for LoRA capacity; default to 8) ---------
per_class_lora_rank: 8
per_class_lora_alpha: 8

# --- schedule / trainer -----------------------------------------------------------------------
max_iter: 15000
validation_iter: 1000
run_validation_on_start: true   # run one validation pass at iter 0, before training
save_iter: 1000
cycle_lengths: 15000
warm_up_steps: 500
logging_iter: 10
seed: 42

# --- optimizer (AdamW) ------------------------------------------------------------------------
lr: 0.001
betas: [0.9, 0.95]
eps: 1.0e-06
weight_decay: 0.0

# --- validation generation --------------------------------------------------------------------
validation_batch_size: 16

# --- early stopping ---------------------------------------------------------------------------
early_stop_enabled: false
early_stop_metric: nn          # nn | mnn | fid | aq_nn | completeness | precision | boundary_iou
                               # fid is lower-better; every other metric is higher-better
early_stop_patience: 5
early_stop_min_delta: 0.0
early_stop_min_delta_mode: rel  # rel | abs
