# TEMPLATE -- Day 1, metal surface (magnetic_tile), every trained defect type
#
# One of the reference configs docs/pipeline/config-from-request.md is written against (magnetic_tile). Three kinds
# of line: unmarked ones are facts about the magnetic_tile model and are copied as they are; DEPLOYMENT lines
# are the workflow's own values (mount paths, buckets), set once per deployment and shared by every
# request; CHANGES PER REQUEST lines are the request's. A generated config must match this file
# everywhere except the marked lines. Validate with:
#
#   python -m anomalygen.scripts.run_pipeline --config <file> --dry_run
#
# The clean images are the dataset's own: usecase://magnetic_tile pulls them with the masks, so there is
# no override. A request naming specific types keeps only those keys below; one naming none keeps all.
# guardrail is OFF here, alone among the templates: the text check reads the word "crack" in every
# MT_Crack caption as an illegal act and blocks all five images, while the run still passes every
# gate. The dataset is industrial surface imagery in which nothing the guardrail protects can
# appear, so the check costs one defect type and protects nothing.

# ── where things live inside the pod (fixed; prepare fills input) ────────────
input:  /work/dataset                       # DEPLOYMENT: the writable volume; prepare builds the magnetic_tile dataset here
output: /work/out                           # DEPLOYMENT: same volume
recipe: ag_config/exp_texture_ft_magnetic_tile.yaml   # ships with the code; the magnetic_tile model trained under it
checkpoint: /mnt/ckpt/magnetic_tile/iter_000014000.pt # DEPLOYMENT: where the magnetic_tile fine-tuned weights are mounted (an hf:// source once published)

# ── what to generate ──────────────────────────────────────────────────────────
num_sdg: 25                   # CHANGES PER REQUEST: the sum of per_defect_counts
per_defect_counts:            # CHANGES PER REQUEST: keep only the types the request names; 5 each
  metal_surface+MT_Blowhole: 5
  metal_surface+MT_Break: 5
  metal_surface+MT_Crack: 5
  metal_surface+MT_Fray: 5
  metal_surface+MT_Uneven: 5
mode: inference
amp_per_clean_pairing: off      # amp only; must stay off under amg
output_naming: indexed          # amg draws clean images round-robin and may reuse one

# ── seeds / execution (fixed) ─────────────────────────────────────────────────
base_seed: 1
num_gpus: 1
guardrail: false                # see the header: on, MT_Crack delivers zero images

# ── mask backend: amg, Gemma started by this run (fixed for magnetic_tile) ──────────────
# The pod needs max(2, num_gpus) GPUs and the Gemma weights on the checkpoints volume; nothing is
# serving beforehand and no registry or key is involved.
amg_serve: gemma-4-31b-it
amg_gen_model: null             # -> the recipe's served model
amg_judge_model: null           # -> the recipe's served model
amg_model_registry: null
amg_cache_dir: /work/amg_cache/magnetic_tile                # DEPLOYMENT: a writable path; keep one per use case so runs reuse the distilled library
amg_beam_multi: 4               # the local-Gemma recipe: in-loop beam + the three information channels
amg_beam_pairwise: true
amg_exemplar_captions: true
amg_exemplar_visual_prompt: true
amg_coverage_note: true

# ── sources and sink ──────────────────────────────────────────────────────────
staging:
  fetch:
    input:
      - usecase://magnetic_tile       # magnetic_tile's shipped prepare script: pulls the public GitHub dataset into the Step 1 layout
  publish:
    output: s3://sdg/generated/defect_image_generation/day1/magnetic_tile/   # DEPLOYMENT: the bucket and prefix root; nothing per request: the tail is day1/<usecase>/ and ends there

# ── stages (fixed) ────────────────────────────────────────────────────────────
stages: [prepare, amg, generate, export, publish]
