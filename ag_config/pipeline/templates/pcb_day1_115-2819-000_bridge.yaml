# TEMPLATE -- Day 1, component 115-2819-000 (an IC), its real image, bridge defects
#
# One of the reference configs docs/pipeline/config-from-request.md is written against (pcb). Three kinds of
# line: unmarked ones are facts about the pcb model and are copied as they are; DEPLOYMENT lines
# are the workflow's own values (mount paths, buckets), set once per deployment and shared by every
# request; CHANGES PER REQUEST lines are the request's. A generated config must match this file
# everywhere except the marked lines. Validate with:
#
#   python -m anomalygen.scripts.run_pipeline --config <file> --dry_run
#
# Concrete instance of pcb_day1_bridge.yaml. The real image is the Spark USD dataset's
# input_real_image/115_2819_000.jpg (401x346, the IC training crop size).

# ── where things live inside the pod (fixed; prepare fills input) ────────────
input:  /work/dataset                       # DEPLOYMENT: the writable volume; prepare builds the pcb dataset here
output: /work/out                           # DEPLOYMENT: same volume
recipe: ag_config/exp_texture_ft_pcb.yaml   # ships with the code; the pcb model trained under it
checkpoint: /mnt/ckpt/pcb/iter_000015000.pt # DEPLOYMENT: where the pcb fine-tuned weights are mounted (an hf:// source once published)

# ── what to generate ──────────────────────────────────────────────────────────
num_sdg: 5
per_defect_counts: {IC+bridge: 5}   # CHANGES PER REQUEST: one <texture>+<defect>, count = num_sdg
mode: inference
amp_per_clean_pairing: off      # amp only; must stay off under amg
output_naming: indexed          # amg may draw the one clean image more than once

# ── seeds / execution (fixed) ─────────────────────────────────────────────────
base_seed: 1
num_gpus: 1
guardrail: true

# ── mask backend: amg, Astra through a registry file (fixed for pcb) ─────────
amg_serve: null
amg_gen_model: azure/openai/gpt-6-astra
amg_judge_model: azure/openai/gpt-6-astra
amg_model_registry: /mnt/secrets/endpoints.yaml   # DEPLOYMENT: where the model registry is mounted; it holds the key, never in this file
amg_cache_dir: /work/amg_cache/pcb                # DEPLOYMENT: a writable path; keep one per use case so runs reuse the distilled library

# ── sources and sink ──────────────────────────────────────────────────────────
staging:
  fetch:
    input:
      - usecase://pcb                 # pcb's shipped prepare script: pulls nvidia/Cosmos-AnomalyGen-PCB-Dataset into the Step 1 layout
    input_override:                   # paths INSIDE input that are REPLACED by the sources listed for them
      IC/clean_image:              # CHANGES PER REQUEST: Decision 1 -- the whole clean_image/ of that texture
        - hf://datasets/nvidia/Spark-AnomalyGen-USD@0bbac7b7322afcfa0d58c837c17fddaee84d9b76/input_real_image/115_2819_000.jpg   # CHANGES PER REQUEST: the attached real image, kept under its own name
  publish:
    output: s3://sdg/generated/defect_image_generation/day1/pcb/115-2819-000/bridge/   # DEPLOYMENT: the bucket and prefix root; CHANGES PER REQUEST: the <component>/<defect>/ tail after day1/pcb/

# ── stages (fixed) ────────────────────────────────────────────────────────────
stages: [prepare, amg, generate, export, publish]
